<!doctype html>
<html lang="zh-CN" style="background-color: #0b0e14;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Stock-G 美股量化监控预警系统</title>
    <meta name="description" content="专业级美股超短线量化交易监控扫描与实时预警APP，专为1-5天高胜率短线打造，支持暴跌抄底、开盘爆发与区间震荡模型及多频预警。" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0b0e14;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        overflow-x: hidden;
      }
      #root {
        min-height: 100%;
        background-color: #0b0e14;
      }
      .app-splash-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background-color: #0b0e14;
        color: #94a3b8;
      }
      .app-splash-spinner {
        width: 44px;
        height: 44px;
        border: 3.5px solid #1e293b;
        border-top-color: #38bdf8;
        border-right-color: #34a853;
        border-radius: 50%;
        animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script>
      window.addEventListener('error', function(e) {
        console.error('[Stock-G Global Error]', e.message, e.filename, e.lineno);
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('[Stock-G Unhandled Rejection]', e.reason);
      });
    </script>
  </head>
  <body style="background-color: #0b0e14;">
    <div id="root">
      <div class="app-splash-loader">
        <div class="app-splash-spinner"></div>
        <div style="margin-top: 18px; font-size: 15px; font-weight: 700; color: #f1f5f9; letter-spacing: 0.5px;">Stock-G 美股量化系统</div>
        <div style="margin-top: 6px; font-size: 12px; color: #64748b;">Google Material 3 · 正在启动量化引擎...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
